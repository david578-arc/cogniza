AWSTemplateFormatVersion: '2010-09-09'
Description: 'MedInsight AI — AWS Application Load Balancer + ECS Fargate CloudFormation Stack'

Parameters:
  ContainerImageUri:
    Type: String
    Description: 'ECR Container Image URI (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/medinsight-backend:latest)'

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'VPC ID for deploying the ALB and ECS Tasks'

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'List of at least 2 public Subnet IDs in different Availability Zones'

  MongoDbUrl:
    Type: String
    NoEcho: true
    Default: 'mongodb+srv://Roshan2106:1234@cognizant.mhj2q40.mongodb.net/?appName=Cognizant'
    Description: 'MongoDB Atlas Connection String'

  JwtSecretKey:
    Type: String
    NoEcho: true
    Default: 'medinsight-production-secure-jwt-key-2026-fargate-alb'
    Description: 'JWT Secret Key for authentication (min 32 chars)'

  GenAiApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: 'Google Gemini AI API Key (Optional)'

Resources:
  # --- IAM Roles ---
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-EcsTaskExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # --- CloudWatch Log Group ---
  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}-medinsight-backend'
      RetentionInDays: 14

  # --- Security Groups ---
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Allow inbound HTTP/HTTPS traffic to Application Load Balancer'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ALB-SG'

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Allow inbound traffic only from Application Load Balancer to FastAPI'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ECS-SG'

  # --- Application Load Balancer (ALB) ---
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-alb'
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Project
          Value: MedInsight-AI

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-tg'
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Project
          Value: MedInsight-AI

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # --- ECS Cluster & Fargate Service ---
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      Tags:
        - Key: Project
          Value: MedInsight-AI

  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-backend-task'
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: medinsight-backend
          Image: !Ref ContainerImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: MONGODB_URL
              Value: !Ref MongoDbUrl
            - Name: MONGODB_DB_NAME
              Value: 'medinsight_db'
            - Name: JWT_SECRET_KEY
              Value: !Ref JwtSecretKey
            - Name: JWT_ALGORITHM
              Value: 'HS256'
            - Name: ACCESS_TOKEN_EXPIRE_MINUTES
              Value: '480'
            - Name: ML_MODEL_PATH
              Value: 'app/ml/artifacts/model.joblib'
            - Name: ML_MODEL_TYPE
              Value: 'ensemble'
            - Name: CORS_ORIGINS
              Value: '*'
            - Name: GENAI_PROVIDER
              Value: 'gemini'
            - Name: GENAI_MODEL
              Value: 'gemini-1.5-flash'
            - Name: GENAI_API_KEY
              Value: !Ref GenAiApiKey
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: 'fastapi-ml'

  EcsFargateService:
    Type: AWS::ECS::Service
    DependsOn:
      - AlbHttpListener
    Properties:
      ServiceName: !Sub '${AWS::StackName}-service'
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref EcsTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref EcsSecurityGroup
      LoadBalancers:
        - ContainerName: medinsight-backend
          ContainerPort: 8000
          TargetGroupArn: !Ref AlbTargetGroup

Outputs:
  AlbDnsName:
    Description: 'Public DNS URL of Application Load Balancer'
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-AlbDnsName'

  BackendApiUrl:
    Description: 'FastAPI Backend Endpoint URL for AWS Amplify VITE_API_BASE_URL'
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/api'

  SwaggerDocsUrl:
    Description: 'Interactive Swagger UI Documentation URL'
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/docs'
